spring.profiles.active=dev

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ── Schema: Flyway manda, Hibernate so confere ──────────────────────────
#
# Era ddl-auto=update, que adivinhava as alteracoes a partir das entidades.
# Isso nunca removia coluna (avaliacoes_iqc ainda carrega orfas), nao fazia
# migracao de dado, nao deixava historico do que mudou e quando, e falhava em
# silencio: um ALTER TABLE ADD COLUMN NOT NULL em tabela populada e recusado
# pelo banco, o Hibernate desiste sem interromper o boot, e a aplicacao sobe
# verde para quebrar com 500 na primeira consulta.
#
# Agora as alteracoes ficam em db/migration, versionadas e revisaveis no diff.
# validate nao altera nada: so recusa subir se o schema divergir das entidades,
# transformando em erro de boot o que antes viraria erro em producao.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# O banco de producao ja existe e foi criado pelo ddl-auto. baseline-on-migrate
# faz o Flyway marca-lo como ja estando na V1 (o retrato desse schema) e aplicar
# so da V2 em diante. Banco vazio roda V1 e V2 normalmente.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema herdado do ddl-auto=update

# Upload de planilhas (reimportação do cadastro IPTU)
spring.servlet.multipart.max-file-size=80MB
spring.servlet.multipart.max-request-size=80MB

# Batch JDBC para atualizações em massa (reimportação)
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_updates=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true